name: Deploy to GitHub Pages

# Deploys only after the CI workflow succeeded on main (lint, typecheck, unit, pipeline check, build, e2e).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    # Manual runs are allowed; automatic ones need a green CI on the commit being deployed.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # the commit CI validated, not whatever main became since
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Site origin, lower-cased (GitHub owners are case-insensitive, canonical URLs are not)
        run: echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER,,}.github.io" >> "$GITHUB_ENV"
      - name: Build (served from /<repo>/ on GitHub Pages)
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Check canonical, sitemap and robots
        run: |
          grep -q 'rel="canonical" href="'"$SITE_URL"'/' site/dist/index.html
          test -f site/dist/sitemap-index.xml
          ! grep -q styleguide site/dist/sitemap-0.xml
          grep -q '^Sitemap: ' site/dist/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
